<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>MyList</title>
  <meta name="description" content="La tua to-do list veloce, con dettatura e smistamento intelligente.">
  <meta name="theme-color" content="#F7F7F5" id="metaTheme">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/uicons/uicons.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Applica il tema prima del primo paint, per evitare il flash bianco
    try {
      const s = JSON.parse(localStorage.getItem('mylist.settings.v1') || '{}');
      if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
    } catch (e) {}
  </script>
  <script src="js/version.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="top-row">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><svg viewBox="104 150 304 212" fill="none" stroke="currentColor" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"><path d="M122 224v64M172 176v160M222 208v96"/><path d="M268 262 312 306 390 204"/></svg></span>
          <span class="brand-name">MyList</span>
          <span class="ver" id="brandVer"></span>
        </div>
        <div class="top-actions">
          <button class="icon-btn" id="btnSettings" aria-label="Impostazioni"></button>
        </div>
      </div>

      <div class="search" id="searchBox" hidden>
        <span class="search-ico" id="searchIco"></span>
        <input id="searchInput" type="search" placeholder="Cerca tra voci e appunti…" autocomplete="off" enterkeyhint="search">
        <button class="search-x" id="searchClose" type="button" aria-label="Chiudi ricerca"></button>
      </div>

      <div class="title-row">
        <div class="title">
          <h1 id="viewTitle">Tutte</h1>
          <p id="viewSub" class="sub"></p>
        </div>
        <div class="title-actions">
          <button class="icon-btn small" id="btnGroup" aria-label="Raggruppa per lista"></button>
          <button class="icon-btn small" id="btnLists" aria-label="Gestisci liste"></button>
          <button class="icon-btn small" id="btnEditList" aria-label="Modifica lista" hidden></button>
        </div>
      </div>
    </header>

    <nav class="chips" id="chips" aria-label="Liste"></nav>

    <main id="main" class="main"></main>
  </div>

  <!-- Barra di inserimento rapido -->
  <form class="composer" id="composer" autocomplete="off">
    <button type="button" class="target" id="btnTarget" aria-label="Lista di destinazione"></button>
    <input id="newText" type="text" placeholder="Cosa devi fare?" enterkeyhint="send" autocapitalize="sentences">
    <button type="submit" class="go" id="btnGo" aria-label="Detta o aggiungi"></button>
  </form>
  <div class="picker" id="targetPicker" hidden></div>

  <!-- Overlay dettatura -->
  <div class="voice" id="voice" hidden>
    <div class="voice-inner">
      <p class="voice-hint" id="voiceHint">Ti ascolto…</p>
      <button class="voice-orb" id="voiceOrb" aria-label="Termina dettatura">
        <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span>
        <span class="orb-ico" id="voiceOrbIco"></span>
      </button>
      <p class="voice-text" id="voiceText"></p>
      <div class="voice-bar" id="voiceBar" aria-hidden="true"><span></span></div>
      <p class="voice-target" id="voiceTarget"></p>
    </div>
    <div class="voice-actions">
      <button class="pill-btn ghost" id="voiceCancel">Annulla</button>
      <button class="pill-btn" id="voiceDone">Invia ora</button>
    </div>
  </div>

  <!-- Bottom sheet generico -->
  <dialog class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" popover="manual">
    <span id="toastText"></span>
    <button id="toastAction" hidden></button>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" hidden>
</body>
</html>
